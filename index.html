<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis IPA (Kimia, Biologi, Bumi & Antariksa)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
            position: relative;
        }
        .header-main-title {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            color: #0056b3;
            margin: 0;
            font-size: 2em;
        }
        .author-info {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .author-info p {
            margin: 0;
            font-size: 0.9em;
            color: #555;
        }
        .author-info p:first-child {
            font-weight: bold;
            color: #333;
            font-size: 1em;
        }
        .header-image {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0056b3;
            z-index: 10;
        }
        .left-header-image {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #0056b3;
            z-index: 10;
        }
        h2 {
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], select {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .question {
            margin-bottom: 20px;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .question p {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
            font-weight: normal;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #218838;
        }
        #timer {
            font-size: 1.2em;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 15px;
            text-align: right;
        }
        #timeLimitDisplay {
            text-align: right;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 50px;
        }
        #results {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #e9ecef;
            display: none;
        }
        .correct {
            color: green;
            font-weight: bold;
        }
        .incorrect {
            color: red;
            font-weight: bold;
        }
        .cooldown-message {
            text-align: center;
            font-size: 1.2em;
            color: #d9534f;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #d9534f;
            border-radius: 5px;
            background-color: #ffe0e0;
        }
        @media (max-width: 600px) {
            .header-image, .left-header-image {
                position: static;
                margin: 10px auto;
                display: block;
            }
            .header-main-title, .author-info {
                text-align: center;
            }
            .container {
                position: static;
            }
            #timeLimitDisplay {
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-main-title">
            <h1>Kuis IPA</h1>
        </div>
        <div class="author-info">
            <p>By. Torus Manuntun Nababan, S.Pd.,M.Pd</p>
            <p>(Pengembang Soal Kuis)</p>
        </div>
        <img src="logo.png" alt="Foto Torus Manuntun Nababan, S.Pd.,M.Pd" class="header-image">
        <img src="jas.jpg" alt="Ilustrasi Jas" class="left-header-image">

        <p id="timeLimitDisplay">Waktu pengerjaan: <span id="timeLimit">30</span> menit</p>
        <div id="timer">Waktu tersisa: 30:00</div>

        <form id="quizForm">
            <h2>Identitas Siswa</h2>
            <div class="form-group">
                <label for="sekolah">Nama Sekolah:</label>
                <input type="text" id="sekolah" name="sekolah" required>
            </div>
            <div class="form-group">
                <label for="nama">Nama Siswa:</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            <div class="form-group">
                <label for="kelas">Kelas:</label>
                <input type="text" id="kelas" name="kelas" required>
            </div>
            <div class="form-group">
                <label for="semester">Semester:</label>
                <select id="semester" name="semester" required>
                    <option value="">Pilih Semester</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tahunAjaran">Tahun Ajaran:</label>
                <input type="text" id="tahunAjaran" name="tahunAjaran" placeholder="Contoh: 2024/2025" required>
            </div>

            <hr>

            <h2>Soal Kuis</h2>
            <div id="questionsContainer">
            </div>

            <button type="submit">Selesai Kuis</button>
        </form>

        <div id="results">
            <h2>Hasil Kuis</h2>
            <p><strong>Nama Siswa:</strong> <span id="resultNama"></span></p>
            <p><strong>Skor Anda:</strong> <span id="score"></span></p>
            <p id="message"></p>
            <h3>Detail Jawaban:</h3>
            <div id="answerDetails">
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // Jenis-jenis Reaksi Kimia (3 soal)
            {
                topic: "Jenis-jenis Reaksi Kimia",
                question: "Reaksi kimia di mana dua atau lebih zat bergabung membentuk zat baru yang lebih kompleks disebut reaksi...",
                options: ["dekomposisi", "sintesis (penggabungan)", "substitusi tunggal", "pembakaran"],
                answer: "sintesis (penggabungan)"
            },
            {
                topic: "Jenis-jenis Reaksi Kimia",
                question: "Contoh reaksi dekomposisi (penguraian) adalah...",
                options: ["H₂ + O₂ → H₂O", "CaCO₃ → CaO + CO₂", "C₃H₈ + O₂ → CO₂ + H₂O", "Zn + HCl → ZnCl₂ + H₂"],
                answer: "CaCO₃ → CaO + CO₂"
            },
            {
                topic: "Jenis-jenis Reaksi Kimia",
                question: "Reaksi antara zat asam dan basa yang menghasilkan garam dan air disebut reaksi...",
                options: ["oksidasi", "reduksi", "netralisasi", "substitusi"],
                answer: "netralisasi"
            },
            
            // Faktor yang Memengaruhi Laju Reaksi (3 soal)
            {
                topic: "Faktor yang Memengaruhi Laju Reaksi",
                question: "Peningkatan suhu biasanya mempercepat laju reaksi karena...",
                options: ["konsentrasi meningkat", "ukuran partikel mengecil", "energi kinetik partikel meningkat", "tekanan menurun"],
                answer: "energi kinetik partikel meningkat"
            },
            {
                topic: "Faktor yang Memengaruhi Laju Reaksi",
                question: "Faktor yang berkaitan dengan luas permukaan zat padat dalam reaksi adalah...",
                options: ["konsentrasi", "suhu", "luas permukaan sentuh", "katalis"],
                answer: "luas permukaan sentuh"
            },
            {
                topic: "Faktor yang Memengaruhi Laju Reaksi",
                question: "Zat yang mempercepat laju reaksi tanpa ikut bereaksi secara permanen disebut...",
                options: ["inhibitor", "katalis", "pelarut", "reaktan"],
                answer: "katalis"
            },
            
            // Genetika Dasar (Mendel) (3 soal)
            {
                topic: "Genetika Dasar (Mendel)",
                question: "Hukum Mendel I (Hukum Segregasi) menyatakan bahwa alel pada lokus yang sama akan...",
                options: ["berpasangan secara acak", "berpisah saat pembentukan gamet", "tetap bersama saat pembentukan gamet", "saling mempengaruhi"],
                answer: "berpisah saat pembentukan gamet"
            },
            {
                topic: "Genetika Dasar (Mendel)",
                question: "Istilah yang digunakan untuk menggambarkan sifat yang muncul atau menutupi sifat lain dalam persilangan adalah...",
                options: ["resesif", "heterozigot", "dominan", "homozigot"],
                answer: "dominan"
            },
            {
                topic: "Genetika Dasar (Mendel)",
                question: "Susunan genetik suatu individu disebut...",
                options: ["fenotipe", "genotipe", "alel", "kromosom"],
                answer: "genotipe"
            },
            
            // Mutasi, Pewarisan, dan Bioteknologi (3 soal)
            {
                topic: "Mutasi, Pewarisan, dan Bioteknologi",
                question: "Perubahan materi genetik yang terjadi secara spontan atau akibat agen tertentu disebut...",
                options: ["reproduksi", "adaptasi", "mutasi", "evolusi"],
                answer: "mutasi"
            },
            {
                topic: "Mutasi, Pewarisan, dan Bioteknologi",
                question: "Bioteknologi yang memanfaatkan mikroorganisme untuk menghasilkan produk seperti tempe atau yoghurt disebut bioteknologi...",
                options: ["modern", "tradisional", "genetik", "reproduksi"],
                answer: "tradisional"
            },
            {
                topic: "Mutasi, Pewarisan, dan Bioteknologi",
                question: "Proses transfer gen dari satu organisme ke organisme lain untuk mendapatkan sifat baru disebut...",
                options: ["kloning", "pemuliaan selektif", "rekayasa genetika", "fermentasi"],
                answer: "rekayasa genetika"
            },
            
            // Asam, Basa, Garam (3 soal)
            {
                topic: "Asam, Basa, Garam",
                question: "Zat yang menghasilkan ion hidrogen (H+) saat dilarutkan dalam air dan memiliki pH kurang dari 7 adalah...",
                options: ["basa", "garam", "asam", "netral"],
                answer: "asam"
            },
            {
                topic: "Asam, Basa, Garam",
                question: "Indikator alami yang dapat digunakan untuk menguji larutan asam atau basa adalah...",
                options: ["kertas lakmus", "kunyit", "fenolftalein", "metil jingga"],
                answer: "kunyit"
            },
            {
                topic: "Asam, Basa, Garam",
                question: "Garam terbentuk dari reaksi antara...",
                options: ["asam dan air", "basa dan air", "asam dan basa", "unsur dan senyawa"],
                answer: "asam dan basa"
            },
            
            // Bahan Aditif dan Adiktif (3 soal)
            {
                topic: "Bahan Aditif dan Adiktif",
                question: "Zat yang ditambahkan pada makanan untuk meningkatkan warna, rasa, atau daya awet disebut...",
                options: ["bahan adiktif", "bahan kimia", "bahan aditif", "racun"],
                answer: "bahan aditif"
            },
            {
                topic: "Bahan Aditif dan Adiktif",
                question: "Zat yang jika dikonsumsi dapat menyebabkan kecanduan dan mempengaruhi sistem saraf pusat adalah...",
                options: ["pemanis buatan", "pewarna makanan", "bahan adiktif", "pengawet"],
                answer: "bahan adiktif"
            },
            {
                topic: "Bahan Aditif dan Adiktif",
                question: "Contoh bahan adiktif yang terkandung dalam rokok adalah...",
                options: ["kafein", "nikotin", "etanol", "sianida"],
                answer: "nikotin"
            },
            
            // Lapisan Bumi, Gempa, Gunung Api (3 soal)
            {
                topic: "Lapisan Bumi, Gempa, Gunung Api",
                question: "Lapisan terluar bumi yang berupa batuan padat dan tempat kita tinggal disebut...",
                options: ["inti bumi", "mantel bumi", "kerak bumi", "litosfer"],
                answer: "kerak bumi"
            },
            {
                topic: "Lapisan Bumi, Gempa, Gunung Api",
                question: "Gempa bumi yang disebabkan oleh aktivitas tektonik lempeng bumi disebut...",
                options: ["gempa vulkanik", "gempa runtuhan", "gempa tektonik", "gempa buatan"],
                answer: "gempa tektonik"
            },
            {
                topic: "Lapisan Bumi, Gempa, Gunung Api",
                question: "Saluran tempat keluarnya magma, gas, dan material padat dari perut bumi saat erupsi adalah...",
                options: ["kawah", "lava", "ventilasi", "puncak"],
                answer: "ventilasi"
            },
            
            // Tata Surya, Gerhana, dan Satelit (3 soal)
            {
                topic: "Tata Surya, Gerhana, dan Satelit",
                question: "Planet yang dikenal sebagai 'Bintang Fajar' atau 'Bintang Senja' adalah...",
                options: ["Mars", "Venus", "Jupiter", "Saturnus"],
                answer: "Venus"
            },
            {
                topic: "Tata Surya, Gerhana, dan Satelit",
                question: "Gerhana matahari total terjadi ketika posisi Matahari, Bulan, dan Bumi berada dalam satu garis lurus dan Bulan menutupi Matahari secara...",
                options: ["sebagian", "total", "parsial", "penumbra"],
                answer: "total"
            },
            {
                topic: "Tata Surya, Gerhana, dan Satelit",
                question: "Satelit alami Bumi adalah...",
                options: ["Mars", "Bulan", "Titan", "Ganymede"],
                answer: "Bulan"
            },
            
            // Soal Tambahan untuk mencapai 30 soal
            // Jenis-jenis Reaksi Kimia (Lanjutan)
            {
                topic: "Jenis-jenis Reaksi Kimia",
                question: "Reaksi di mana suatu unsur menggantikan unsur lain dalam suatu senyawa disebut reaksi...",
                options: ["netralisasi", "pembakaran", "substitusi tunggal", "pengendapan"],
                answer: "substitusi tunggal"
            },
            {
                topic: "Jenis-jenis Reaksi Kimia",
                question: "Reaksi yang melepaskan energi panas ke lingkungan disebut reaksi...",
                options: ["endoterm", "eksoterm", "elektrolisis", "fotosintesis"],
                answer: "eksoterm"
            },
            
            // Faktor yang Memengaruhi Laju Reaksi (Lanjutan)
            {
                topic: "Faktor yang Memengaruhi Laju Reaksi",
                question: "Menghancurkan zat padat menjadi bubuk akan mempercepat laju reaksi karena...",
                options: ["meningkatkan suhu", "meningkatkan konsentrasi", "meningkatkan tekanan", "meningkatkan luas permukaan sentuh"],
                answer: "meningkatkan luas permukaan sentuh"
            },
            
            // Genetika Dasar (Mendel) (Lanjutan)
            {
                topic: "Genetika Dasar (Mendel)",
                question: "Organisme yang memiliki dua alel yang berbeda untuk suatu sifat (Aa) disebut...",
                options: ["homozigot dominan", "homozigot resesif", "heterozigot", "galur murni"],
                answer: "heterozigot"
            },
            
            // Asam, Basa, Garam (Lanjutan)
            {
                topic: "Asam, Basa, Garam",
                question: "Larutan yang memiliki rasa pahit dan terasa licin saat disentuh, serta memiliki pH lebih dari 7, adalah...",
                options: ["asam", "netral", "basa", "garam"],
                answer: "basa"
            },
            
            // Bahan Aditif dan Adiktif (Lanjutan)
            {
                topic: "Bahan Aditif dan Adiktif",
                question: "Bahan aditif yang berfungsi untuk mencegah makanan cepat busuk adalah...",
                options: ["pemanis", "pewarna", "pengawet", "penyedap"],
                answer: "pengawet"
            },
            
            // Lapisan Bumi, Gempa, Gunung Api (Lanjutan)
            {
                topic: "Lapisan Bumi, Gempa, Gunung Api",
                question: "Lapisan bumi yang sebagian besar terdiri dari batuan cair yang sangat panas (magma) adalah...",
                options: ["inti luar", "inti dalam", "mantel bumi", "kerak bumi"],
                answer: "mantel bumi"
            },
            
            // Tata Surya, Gerhana, dan Satelit (Lanjutan)
            {
                topic: "Tata Surya, Gerhana, dan Satelit",
                question: "Gerhana bulan terjadi ketika Bumi berada di antara Matahari dan Bulan, dan Bulan berada dalam...",
                options: ["umbra Bumi", "penumbra Bumi", "garis lurus dengan Matahari dan Bulan", "orbit Bulan"],
                answer: "umbra Bumi"
            }
        ];

        const timeLimitInMinutes = 30; 
        let timeLeft = timeLimitInMinutes * 60; // seconds
        let timerInterval;

        const quizForm = document.getElementById('quizForm');
        const questionsContainer = document.getElementById('questionsContainer');
        const timerDisplay = document.getElementById('timer');
        const resultsDiv = document.getElementById('results');
        const resultNama = document.getElementById('resultNama');
        const scoreDisplay = document.getElementById('score');
        const messageDisplay = document.getElementById('message');
        const answerDetailsDiv = document.getElementById('answerDetails');

        // Durasi cooldown: 1 jam dalam milidetik
        const cooldownDuration = 60 * 60 * 1000;
        const lastQuizCompletionKey = 'lastQuizCompletionTime';

        // Fungsi untuk mengacak array (algoritma Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Fungsi untuk menghasilkan dan menampilkan pertanyaan
        function generateQuestions() {
            shuffleArray(questions);
            questionsContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.classList.add('question');

                const shuffledOptions = [...q.options];
                shuffleArray(shuffledOptions);

                questionDiv.innerHTML = `
                    <p>${index + 1}. ${q.question}</p>
                    <div class="options">
                        ${shuffledOptions.map((option) => `
                            <label>
                                <input type="radio" name="q${index}" value="${option}"> ${option}
                            </label>
                        `).join('')}
                    </div>
                `;
                questionsContainer.appendChild(questionDiv);
            });
        }

        // Fungsi untuk memulai timer
        function startTimer() {
            timerInterval = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `Waktu tersisa: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Waktu habis! Kuis akan otomatis disubmit.");
                    quizForm.dispatchEvent(new Event('submit'));
                }
                timeLeft--;
            }, 1000);
        }

        // Penanganan saat formulir disubmit
        quizForm.addEventListener('submit', function(event) {
            event.preventDefault();
            clearInterval(timerInterval);

            let totalScore = 0;
            const pointsPerCorrect = 3; 
            const maxPossibleScore = questions.length * pointsPerCorrect;

            const answers = {};

            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const userAnswer = selectedOption ? selectedOption.value : null;
                answers[`q${index}`] = userAnswer;

                if (userAnswer === q.answer) {
                    totalScore += pointsPerCorrect;
                }
            });

            localStorage.setItem(lastQuizCompletionKey, Date.now());

            // Tampilkan hasil
            resultNama.textContent = document.getElementById('nama').value;
            scoreDisplay.textContent = `${totalScore} / ${maxPossibleScore}`;

            // Tentukan pesan berdasarkan skor (kriteria 70%)
            if (totalScore >= (0.70 * maxPossibleScore)) {
                messageDisplay.textContent = "Selamat Anda Pemenang";
                messageDisplay.style.color = "green";
            } else {
                messageDisplay.textContent = "Anda Belum Beruntung, Belajar Lagi Ya";
                messageDisplay.style.color = "red";
            }

            // Tampilkan detail jawaban
            answerDetailsDiv.innerHTML = '';
            questions.forEach((q, index) => {
                const userAnswer = answers[`q${index}`];
                const detailDiv = document.createElement('p');
                let answerStatusClass = '';
                let userAnswerText = userAnswer !== null ? userAnswer : 'Tidak dijawab';

                if (userAnswer === q.answer) {
                    answerStatusClass = 'correct';
                } else if (userAnswer !== null) {
                    answerStatusClass = 'incorrect';
                } else {
                    answerStatusClass = '';
                }

                detailDiv.innerHTML = `
                    <strong>${index + 1}. ${q.question}</strong><br>
                    Jawaban Anda: <span class="${answerStatusClass}">
                        ${userAnswerText}
                    </span><br>
                    Kunci Jawaban: <span class="correct">${q.answer}</span>
                `;
                answerDetailsDiv.appendChild(detailDiv);
            });

            quizForm.style.display = 'none';
            resultsDiv.style.display = 'block';
        });

        // Inisialisasi kuis dan cek cooldown saat halaman dimuat
        window.onload = function() {
            const lastCompletionTime = localStorage.getItem(lastQuizCompletionKey);
            if (lastCompletionTime) {
                const timeElapsed = Date.now() - parseInt(lastCompletionTime);
                if (timeElapsed < cooldownDuration) {
                    const remainingTime = cooldownDuration - timeElapsed;
                    const minutes = Math.floor(remainingTime / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

                    quizForm.style.display = 'none';
                    timerDisplay.style.display = 'none';
                    document.getElementById('timeLimitDisplay').style.display = 'none';
                    const cooldownMessageDiv = document.createElement('div');
                    cooldownMessageDiv.classList.add('cooldown-message');
                    cooldownMessageDiv.innerHTML = `
                        Anda telah menyelesaikan kuis ini. <br>
                        Silakan coba lagi dalam **${minutes.toString().padStart(2, '0')} menit dan ${seconds.toString().padStart(2, '0')} detik**.
                    `;
                    document.querySelector('.container').insertBefore(cooldownMessageDiv, document.getElementById('quizForm'));
                    return;
                }
            }
            // Jika tidak ada cooldown atau cooldown sudah berakhir, inisialisasi kuis
            generateQuestions();
            startTimer();
        };
    </script>
</body>
</html>
